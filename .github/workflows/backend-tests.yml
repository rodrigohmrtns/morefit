name: Backend tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: morefit_test
      JWT_SECRET: ci_secret_do_not_use_in_prod
      EMERGENT_LLM_KEY: ""
      STRIPE_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-anyio httpx

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017; then echo "Mongo up"; exit 0; fi
            sleep 1
          done
          echo "Mongo did not start in time"; exit 1

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q --tb=short
